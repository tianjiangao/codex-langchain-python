name: Offline CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      LANGSMITH_TRACING: 'false'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CODEX_RUN_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check src tests examples integrations scripts
      - run: pytest -q
      - run: python scripts/audit_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/audit_release.py --archives dist/*
# No login, secrets, live model invocation, upload-artifact or publishing steps.
